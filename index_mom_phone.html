<!DOCTYPE html>

<head>

<style>

                  border-radius:8px; font-family:inherit; }

               background:#00ffb3; color:#0e0e0e; border:none;

  .modal-btn.danger { background:#ff5555; color:#fff; }
</style>
</head>
<body>

<h2>📱 Пульт Мамы: Контроль Веры</h2>
<button class="btn" onclick="loadTasks()">🔄 Проверить отметки Веры</button>
<button class="btn btn-alt" onclick="toggleHistory()" id="hist-btn">📜 Показать всю историю</button>
<div id="summary-box"></div>

<!-- Модалка редактора расписания -->
<div class="modal hidden" id="edit-modal">
  <div class="modal-box">
    <div class="modal-title" id="edit-title">✏️ Уроки</div>
    <div class="modal-hint">
      Максимум 6 уроков. Пустые поля — уроков нет.<br>
      Добавьте «*» в конце, если по предмету <b>не задают</b> домашку
      (например, «Музыка*»).
    </div>
    <div id="edit-fields"></div>
    <button class="modal-btn" id="edit-save">💾 Сохранить</button>
    <button class="modal-btn alt" id="edit-cancel">Отмена</button>
    <button class="modal-btn danger" id="edit-reset" style="display:none">
      🗑 Сбросить override
    </button>
  </div>
</div>

<script>
// ============================================================
// КОНФИГУРАЦИЯ
// ============================================================

const SUPABASE_URL = "https://uwuehnueutxpzyzyvxwj.supabase.co";
const SUPABASE_KEY = "sb_publishable_cZn5xVHJ98ITaSR0yFRQBA_JTRkQZDQ";
const TABLE_URL = SUPABASE_URL + "/rest/v1/tasks?select=*&order=created_at.desc&limit=300";
const OVERRIDES_URL = SUPABASE_URL + "/rest/v1/schedule_overrides";

const SCHOOL_CHART = {
  0: ["Математика", "История", "Русский язык", "Литература", "Музыка*"],
  1: ["Разговоры о важном*", "Русский язык", "Математика",
      "Физическая культура*", "Биология", "Изобразительное искусство*"],
  2: ["Иностранный язык", "Русский язык", "История",
      "Литература", "География", "Математика"],
  3: ["Труд*", "Труд*", "Математика", "Физическая культура*", "Русский язык"],
  4: ["История", "Математика", "Русский язык", "Литература", "Музыка*"],
  5: [], 6: []
};

const MUSIC_CHART = {
  0: ["🪈 Специальность (17:45)"],
  1: ["🎼 Муз. литература (14:45)"],
  2: ["🎹 Фортепиано (18:05)", "🪈 Специальность (18:30)"],
  3: ["👥 Ансамбль (17:00)"],
  4: [],
  5: ["🎻 Оркестр (15:00)"],
  6: ["📝 Сольфеджио (11:00)", "🎤 Хор (13:35)"]
};

const DAILY_MUSIC_HOMEWORK = {
  0: [{ text: "🎻 Оркестр: партии (40 мин)", kind: "flute" }],
  1: [{ text: "🎵 Флейта (40 мин)", kind: "flute" },
      { text: "🎹 Фортепиано (20 мин)", kind: "study" }],
  2: [],
  3: [{ text: "📖 Муз. литература (30 мин)", kind: "study" }],
  4: [{ text: "🎵 Флейта (40 мин)", kind: "flute" },
      { text: "🎹 Фортепиано (20 мин)", kind: "study" },
      { text: "🎻 Оркестр: партии (40 мин)", kind: "flute" }],
  5: [{ text: "🎵 Флейта (40 мин)", kind: "flute" },
      { text: "🎹 Фортепиано (20 мин)", kind: "study" },
      { text: "📝 Сольфеджио (30 мин)", kind: "study" }],
  6: [{ text: "🎵 Флейта (40 мин)", kind: "flute" },
      { text: "🎹 Фортепиано (20 мин)", kind: "study" }]
};

const OLYMPIADS = {
  "2026-09-15": "История", "2026-09-17": "Русский язык",
  "2026-09-28": "Английский язык", "2026-10-08": "Биология",
  "2026-10-14": "Математика", "2026-10-20": "География"
};

const WEEKDAYS = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
const MONTHS = ["января","февраля","марта","апреля","мая","июня",
                "июля","августа","сентября","октября","ноября","декабря"];

let showHistory = false;
let overrides = {};

// ============================================================
// ХЕЛПЕРЫ
// ============================================================

const jsDow = d => (d.getDay() + 6) % 7;
const dateKey = d => {
  const x = new Date(d);
  const p = n => String(n).padStart(2, "0");
  return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}`;
};

function subjectsForDate(date) {
  const k = dateKey(date);
  if (overrides[k]) return overrides[k];
  return SCHOOL_CHART[jsDow(date)] || [];
}

function homeworkSubjectsForDate(date) {
  return subjectsForDate(date).filter(s => !s.includes("*"));
}

function dateHasLessons(date) {
  return subjectsForDate(date).length > 0;
}

function nextSchoolDate(fromDate) {
  let d = new Date(fromDate);
  for (let i = 0; i < 7; i++) {
    d.setDate(d.getDate() + 1);
    if (dateHasLessons(d)) return new Date(d);
  }
  return null;
}

function daysFromToday(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const o = new Date(y, m - 1, d);
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((o - t) / 86400000);
}

function dayKey(d) {
  const x = new Date(d);
  return `${x.getFullYear()}-${x.getMonth()+1}-${x.getDate()}`;
}

function dayLabel(d) {
  const x = new Date(d);
  const today = new Date();
  if (dayKey(x) === dayKey(today)) return "Сегодня";
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  if (dayKey(x) === dayKey(yest)) return "Вчера";
  return WEEKDAYS[jsDow(x)];
}

function timeStr(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
}

// ============================================================
// OVERRIDES
// ============================================================

async function loadOverrides() {
  try {
    const res = await fetch(OVERRIDES_URL + "?select=date,subjects", {
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
    });
    if (!res.ok) { overrides = {}; return; }
    const rows = await res.json();
    overrides = {};
    rows.forEach(r => {
      overrides[r.date] = Array.isArray(r.subjects) ? r.subjects : [];
    });
  } catch (e) {
    console.error("overrides load:", e);
    overrides = {};
  }
}

async function saveOverride(dateStr, subjects) {
  const url = OVERRIDES_URL + "?on_conflict=date";
  const res = await fetch(url, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": "resolution=merge-duplicates"
    },
    body: JSON.stringify([{ date: dateStr, subjects }])
  });
  if (!res.ok) {
    console.error("save override:", res.status, await res.text());
    return false;
  }
  return true;
}

async function deleteOverride(dateStr) {
  const url = OVERRIDES_URL + "?date=eq." + dateStr;
  const res = await fetch(url, {
    method: "DELETE",
    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
  });
  return res.ok;
}

// ============================================================
// СВОДКА
// ============================================================

function parseLesson(s) {
  const m = s.match(/\S+\s+(.+?)\s+\((\d{1,2}):(\d{2})\)/);
  if (!m) return null;
  return { name: m[1].trim(), time: `${m[2].padStart(2,"0")}:${m[3]}` };
}

function renderSummary(records) {
  const box = document.getElementById("summary-box");
  const now = new Date();
  const todayStr = now.toDateString();
  const todayRecords = records.filter(r => new Date(r.created_at).toDateString() === todayStr);

  let html = "";

  // ===== СЕГОДНЯ =====
  const subjectsToday = subjectsForDate(now);
  const musicToday = MUSIC_CHART[jsDow(now)] || [];
  const cleanToday = subjectsToday.map(s => s.replace("*", ""));

  html += `<div class="summary-box today">
    <div class="summary-title">
      <span>📍 Сегодня, ${WEEKDAYS[jsDow(now)]} (${now.getDate()} ${MONTHS[now.getMonth()]})</span>
    </div>
    <div class="summary-line"><b>Школа:</b> ${subjectsToday.length} уроков</div>
    <div class="summary-line">${cleanToday.join(", ") || "—"}</div>`;

  if (musicToday.length) {
    html += `<div class="summary-line summary-music" style="margin-top:6px"><b>🎼 Музыкалка:</b></div>`;
    musicToday.forEach(l => {
      const parsed = parseLesson(l);
      let done = false;
      if (parsed) {
        done = todayRecords.some(r => {
          const nr = (r.title || "").toLowerCase();
          return nr.includes(parsed.name.toLowerCase()) && nr.includes(parsed.time);
        });
      }
      html += `<div class="summary-lesson ${done ? 'done' : ''}">${done ? "✅" : "○"} ${l}</div>`;
    });
  } else {
    html += `<div class="summary-line summary-music" style="color:#888">🎼 Музыкалка: занятий нет</div>`;
  }

  html += `</div>`;

  // ===== ЗАВТРА =====
  const tmr = nextSchoolDate(now);
  if (tmr) {
    const tmrKey = dateKey(tmr);
    const subjects = subjectsForDate(tmr);
    const books = homeworkSubjectsForDate(tmr);
    const music = MUSIC_CHART[jsDow(tmr)] || [];
    const cleanSubjects = subjects.map(s => s.replace("*", ""));
    const isOverride = !!overrides[tmrKey];

    html += `<div class="summary-box">
      <div class="summary-title">
        <span>📅 Завтра, ${WEEKDAYS[jsDow(tmr)]} (${tmr.getDate()} ${MONTHS[tmr.getMonth()]})
          ${isOverride ? '<span class="override-badge">изменено</span>' : ''}
        </span>
        <button class="edit-btn" onclick="openEditor('${tmrKey}')">✏️ Изменить</button>
      </div>
      <div class="summary-line"><b>Школа:</b> ${subjects.length} уроков</div>
      <div class="summary-line">${cleanSubjects.join(", ") || "—"}</div>
      <div class="summary-line"><b>📚 Учебников:</b> ${books.length} (${books.join(", ") || "—"})</div>`;

    if (music.length) {
      html += `<div class="summary-line summary-music" style="margin-top:6px"><b>🎼 Музыкалка:</b></div>`;
      music.forEach(l => {
        html += `<div class="summary-lesson">○ ${l}</div>`;
      });
    } else {
      html += `<div class="summary-line summary-music" style="color:#888">🎼 Занятий нет</div>`;
    }
    html += `</div>`;
  }

  box.innerHTML = html;
}

// ============================================================
// РЕДАКТОР РАСПИСАНИЯ
// ============================================================

let editingDateStr = null;

function openEditor(dateStr) {
  editingDateStr = dateStr;
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const dow = jsDow(dt);

  const isOverride = !!overrides[dateStr];
  const current = isOverride ? overrides[dateStr] : (SCHOOL_CHART[dow] || []);

  const titleEl = document.getElementById("edit-title");
  titleEl.textContent = `✏️ Уроки на ${WEEKDAYS[dow]}, ${d} ${MONTHS[m-1]}`;

  const fields = document.getElementById("edit-fields");
  fields.innerHTML = "";
  for (let i = 0; i < 6; i++) {
    const row = document.createElement("div");
    row.className = "lesson-row";
    const num = document.createElement("div");
    num.className = "lesson-num";
    num.textContent = (i + 1) + ".";
    const input = document.createElement("input");
    input.className = "lesson-input";
    input.type = "text";
    input.placeholder = "— пусто —";
    input.value = current[i] || "";
    input.dataset.idx = i;
    row.appendChild(num);
    row.appendChild(input);
    fields.appendChild(row);
  }

  // Кнопка сброса — только если override есть
  const resetBtn = document.getElementById("edit-reset");
  resetBtn.style.display = isOverride ? "block" : "none";

  document.getElementById("edit-modal").classList.remove("hidden");
}

document.getElementById("edit-save").addEventListener("click", async () => {
  if (!editingDateStr) return;

  const inputs = document.querySelectorAll("#edit-fields .lesson-input");
  const subjects = [];
  inputs.forEach(inp => {
    const v = inp.value.trim();
    if (v) subjects.push(v);
  });

  const ok = await saveOverride(editingDateStr, subjects);
  if (ok) {
    overrides[editingDateStr] = subjects;
    document.getElementById("edit-modal").classList.add("hidden");
    // Перерисовать сводку
    loadTasks();
  } else {
    alert("Не удалось сохранить. Попробуйте ещё раз.");
  }
});

document.getElementById("edit-cancel").addEventListener("click", () => {
  document.getElementById("edit-modal").classList.add("hidden");
});

document.getElementById("edit-reset").addEventListener("click", async () => {
  if (!editingDateStr) return;
  if (!confirm("Вернуть стандартное расписание на этот день?")) return;
  const ok = await deleteOverride(editingDateStr);
  if (ok) {
    delete overrides[editingDateStr];
    document.getElementById("edit-modal").classList.add("hidden");
    loadTasks();
  } else {
    alert("Не удалось сбросить.");
  }
});

// ============================================================
// ПЛАН ДНЯ (для нижней части пульта)
// ============================================================

function buildTodayPlan(date) {
  const dow = jsDow(date);

  const olymp = [];
  for (const [dateStr, name] of Object.entries(OLYMPIADS)) {
    const delta = daysFromToday(dateStr);
    if (delta === 1 || delta === 2) {
      olymp.push({ text: `🏆 Олимпиада (${name}, 40 мин)`, kind: "study", section: "school" });
    }
  }

  const school = [];
  const tmr = nextSchoolDate(date);
  if (tmr) {
    for (const subj of homeworkSubjectsForDate(tmr)) {
      school.push({ text: `📚 Домашка: ${subj}`, kind: "study", section: "school" });
    }
  }

  const music = (DAILY_MUSIC_HOMEWORK[dow] || []).map(m => ({
    text: m.text, kind: m.kind, section: "music"
  }));

  const base = [];
  if (dow <= 4) {
    base.push({
      text: dow === 4 ? "🎒 Собрать портфель (на Пн)" : "🎒 Собрать портфель",
      kind: "photo", section: "base"
    });
    base.push({
      text: dow === 4 ? "👗 Приготовить одежду (на Пн)" : "👗 Приготовить одежду",
      kind: "photo", section: "base"
    });
  }
  base.push({ text: "🧹 Прибрать в комнате", kind: "photo", section: "base" });

  return [...olymp, ...school, ...music, ...base];
}

// ============================================================
// НОРМАЛИЗАЦИЯ И ПОИСК
// ============================================================

function normalizeTitle(s) {
  if (!s) return "";
  let out = String(s);
  out = out.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2190}-\u{21FF}]/gu, "");
  out = out.replace(/^\s*(фотоотчет|фотоотчёт|хвост)\s*:?\s*/i, "");
  out = out.replace(/\(\s*\d+\s*мин\s*\)/gi, "");
  out = out.replace(/\d+\s*мин/gi, "");
  out = out.replace(/\[sid=[^\]]+\]/g, "");
  out = out.replace(/,?\s*\d+\s*фрагмент\w*/gi, "");
  out = out.replace(/\(на Пн\)/gi, "");
  out = out.replace(/[.,;:()\[\]]/g, " ");
  out = out.replace(/\s+/g, " ").trim().toLowerCase();
  return out;
}

function titlesMatch(a, b) {
  const na = normalizeTitle(a);
  const nb = normalizeTitle(b);
  if (!na || !nb) return false;
  if (na === nb) return true;
  return na.includes(nb) || nb.includes(na);
}

function findRecordForPlan(planItem, records) {
  for (const r of records) if (titlesMatch(planItem.text, r.title)) return r;
  const keywords = ["математик", "русск", "истори", "литератур", "биолог",
                    "географ", "иностран", "английск", "физкультур", "труд",
                    "музык", "изобразительн", "разговор", "оркестр", "флейт",
                    "фортепиано", "сольфеджио"];
  const pn = normalizeTitle(planItem.text);
  for (const kw of keywords) {
    if (pn.includes(kw)) {
      for (const r of records) if (normalizeTitle(r.title).includes(kw)) return r;
    }
  }
  if (planItem.kind === "photo") {
    const kw = pn.split(" ").pop();
    if (kw && kw.length >= 4) {
      for (const r of records) if (normalizeTitle(r.title).includes(kw)) return r;
    }
  }
  return null;
}

// ============================================================
// ИИ-АНАЛИЗ
// ============================================================

function runAiAnalysis(title, timestamp) {
  const t = (title || "").toLowerCase();
  const tmr = nextSchoolDate(new Date(timestamp));
  if (!tmr) return "📷 Отчёт принят.";
  const subjects = homeworkSubjectsForDate(tmr);
  const dow = jsDow(tmr);

  if (t.includes("портфель")) {
    return `🎒 Портфель на ${WEEKDAYS[dow]}.\nУчебников должно быть: ${subjects.length} (${subjects.join(", ") || "—"}).`;
  }
  if (t.includes("одежд")) {
    const hasPE = subjectsForDate(tmr).some(s => s.toLowerCase().includes("физ"));
    return hasPE ? "👟 Завтра ФИЗКУЛЬТУРА — проверить форму."
                 : `👗 Форма на ${WEEKDAYS[dow]} заявлена.`;
  }
  if (t.includes("комнат")) return "🧹 Уборка: сравните фото ДО и ПОСЛЕ.";
  return "📷 Отчёт принят.";
}

// ============================================================
// ОТРИСОВКА
// ============================================================

function makeStatus(done) {
  const el = document.createElement("div");
  el.className = "task-status" + (done ? " done" : "");
  el.textContent = "✓";
  return el;
}

function makeTimeEl(record) {
  const t = document.createElement("div");
  if (record && record.created_at) {
    t.className = "task-time";
    t.textContent = timeStr(record.created_at);
  } else {
    t.className = "task-time empty";
    t.textContent = "—";
  }
  return t;
}

function extractSid(title) {
  const m = (title || "").match(/sid=(\d+_\d+)/);
  return m ? m[1] : null;
}

function buildPhotoBlock(sid, baseText) {
  if (!sid) return null;
  const t = (baseText || "").toLowerCase();
  const container = document.createElement("div");
  container.className = "photos";

  const makePhoto = (role, label) => {
    const wrap = document.createElement("div");
    const url = `${SUPABASE_URL}/storage/v1/object/public/photo-reports/${sid}/${role}.jpg`;
    const img = document.createElement("img");
    img.src = url;
    img.alt = label;
    img.onerror = () => { wrap.style.display = "none"; };
    wrap.appendChild(img);
    const lbl = document.createElement("div");
    lbl.className = "photo-label";
    lbl.textContent = label;
    wrap.appendChild(lbl);
    return wrap;
  };

  const row = document.createElement("div");
  row.className = "photo-row";

  if (t.includes("комнат")) {
    row.appendChild(makePhoto("room_before", "ДО"));
    row.appendChild(makePhoto("room_after", "ПОСЛЕ"));
  } else if (t.includes("портфель")) {
    row.appendChild(makePhoto("portfolio", "Портфель"));
  } else if (t.includes("одежд")) {
    row.appendChild(makePhoto("clothes", "Одежда"));
  }
  container.appendChild(row);
  return container;
}

function buildAudioPlayer(sid, n) {
  const player = document.createElement("div");
  player.className = "task-player";
  for (let i = 1; i <= n; i++) {
    const frag = document.createElement("div");
    frag.className = "frag";
    const label = document.createElement("span");
    label.textContent = `Фрагмент ${i}`;
    const audio = document.createElement("audio");
    audio.controls = true;
    audio.preload = "none";
    const base = `${SUPABASE_URL}/storage/v1/object/public/flute-recordings/${sid}/frag_${String(i).padStart(2, "0")}`;
    audio.src = base + ".webm";
    let tried = 0;
    const tryNext = () => {
      tried++;
      if (tried === 1) audio.src = base + ".flac";
      else if (tried === 2) audio.src = base + ".m4a";
      else audio.removeEventListener("error", tryNext);
    };
    audio.addEventListener("error", tryNext);
    frag.appendChild(label);
    frag.appendChild(audio);
    player.appendChild(frag);
  }
  return player;
}

function buildPlanRow(planItem, record) {
  const row = document.createElement("div");
  row.className = "task-row";
  row.appendChild(makeStatus(!!record));

  const content = document.createElement("div");
  content.className = "task-content";

  const titleEl = document.createElement("div");
  titleEl.className = "task-title" + (record ? " done" : "");
  titleEl.textContent = planItem.text;
  content.appendChild(titleEl);

  if (planItem.kind === "flute" && record) {
    const sid = extractSid(record.title);
    const fm = (record.title || "").match(/(\d+)\s+фрагмент/);
    if (sid && fm) content.appendChild(buildAudioPlayer(sid, parseInt(fm[1])));
  }

  if (planItem.kind === "photo" && record) {
    const sid = extractSid(record.title);
    const block = buildPhotoBlock(sid, planItem.text);
    if (block) content.appendChild(block);
    const ai = document.createElement("div");
    ai.className = "task-ai";
    ai.textContent = runAiAnalysis(record.title, record.created_at);
    content.appendChild(ai);
  }

  row.appendChild(content);
  row.appendChild(makeTimeEl(record));
  return row;
}

function addSectionHeader(container, text, cls) {
  const el = document.createElement("div");
  el.className = "section-title " + cls;
  el.textContent = text;
  container.appendChild(el);
}

function renderToday(records, container) {
  const now = new Date();
  const todayStr = now.toDateString();
  const todayRecords = records.filter(r =>
    new Date(r.created_at).toDateString() === todayStr
  );

  const head = document.createElement("div");
  head.className = "day-head";
  const dayName = document.createElement("div");
  dayName.className = "day-name";
  dayName.textContent = `📅 Дела на сегодня · ${WEEKDAYS[jsDow(now)]}, ${now.getDate()} ${MONTHS[now.getMonth()]}`;
  head.appendChild(dayName);
  container.appendChild(head);

  const plan = buildTodayPlan(now);
  let doneCount = 0;
  const school = [], music = [], base = [];
  plan.forEach(item => {
    const rec = findRecordForPlan(item, todayRecords);
    if (rec) doneCount++;
    const row = buildPlanRow(item, rec);
    if (item.section === "school") school.push(row);
    else if (item.section === "music") music.push(row);
    else base.push(row);
  });

  if (school.length) {
    addSectionHeader(container, "📚 Учёба", "section-school");
    school.forEach(r => container.appendChild(r));
  }
  if (music.length) {
    addSectionHeader(container, "🎼 Музыкальная домашка", "section-music");
    music.forEach(r => container.appendChild(r));
  }
  if (base.length) {
    addSectionHeader(container, "🏠 Бытовые дела", "section-base");
    base.forEach(r => container.appendChild(r));
  }

  const prog = document.createElement("span");
  prog.className = "day-progress";
  prog.textContent = `${doneCount} / ${plan.length}`;
  dayName.appendChild(prog);
}

function renderHistory(records, container) {
  const byDay = {};
  records.forEach(r => {
    const k = dayKey(r.created_at);
    if (!byDay[k]) byDay[k] = { date: r.created_at, items: [] };
    byDay[k].items.push(r);
  });
  const days = Object.values(byDay).sort((a, b) => new Date(b.date) - new Date(a.date));
  if (!days.length) {
    container.innerHTML = '<div class="empty">Записей пока нет.</div>';
    return;
  }
  days.forEach(day => {
    const head = document.createElement("div");
    head.className = "day-head";
    const d = new Date(day.date);
    const dayName = document.createElement("div");
    dayName.className = "day-name";
    dayName.textContent = `📅 ${dayLabel(d)}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;
    head.appendChild(dayName);
    container.appendChild(head);

    day.items.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    day.items.forEach(r => {
      const row = document.createElement("div");
      row.className = "task-row";
      row.appendChild(makeStatus(true));
      const content = document.createElement("div");
      content.className = "task-content";
      const t = document.createElement("div");
      t.className = "task-title done";
      t.textContent = r.title;
      content.appendChild(t);

      const lower = (r.title || "").toLowerCase();
      if (lower.startsWith("флейта") || lower.startsWith("оркестр")) {
        const sid = extractSid(r.title);
        const fm = (r.title || "").match(/(\d+)\s+фрагмент/);
        if (sid && fm) content.appendChild(buildAudioPlayer(sid, parseInt(fm[1])));
      } else if (lower.startsWith("фотоотчет") || lower.startsWith("фотоотчёт")) {
        const sid = extractSid(r.title);
        const block = buildPhotoBlock(sid, r.title);
        if (block) content.appendChild(block);
      }

      row.appendChild(content);
      row.appendChild(makeTimeEl(r));
      container.appendChild(row);
    });
  });
}

// ============================================================
// ЗАГРУЗКА
// ============================================================

function toggleHistory() {
  showHistory = !showHistory;
  document.getElementById("hist-btn").textContent =
    showHistory ? "📅 Только сегодня" : "📜 Показать всю историю";
  loadTasks();
}

async function loadTasks() {
  const logBox = document.getElementById("log-box");
  try {
    if (!Object.keys(overrides).length) {
      await loadOverrides();
    }

    const res = await fetch(TABLE_URL, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
    });
    const records = await res.json();
    if (!res.ok || !Array.isArray(records)) {
      logBox.innerHTML = '<div class="empty">Ошибка доступа к облаку.</div>';
      return;
    }

    renderSummary(records);
    logBox.innerHTML = "";
    logBox.className = "";

    if (showHistory) renderHistory(records, logBox);
    else renderToday(records, logBox);
  } catch (e) {
    console.error(e);
    logBox.innerHTML = '<div class="empty">Ошибка чтения облака.</div>';
  }
}

loadOverrides().then(() => loadTasks());
setInterval(loadTasks, 60000);
</script>
