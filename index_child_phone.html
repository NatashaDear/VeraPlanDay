const OLYMPIADS = {
  "2026-09-15": "История", "2026-09-17": "Русский язык",

const PHOTO_STEPS = {

  ]

const WEEKDAYS = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
const MONTHS = ["января","февраля","марта","апреля","мая","июня",
                "июля","августа","сентября","октября","ноября","декабря"];

// ============================================================
// OVERRIDES — расписание из облака
// ============================================================

let overrides = {};
let notes = {};

async function loadOverrides() {
  try {
    const res = await fetch(OVERRIDES_URL + "?select=date,subjects", {
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
    });
    if (!res.ok) { overrides = {}; return; }
    const rows = await res.json();
    overrides = {};
    rows.forEach(r => {
      overrides[r.date] = Array.isArray(r.subjects) ? r.subjects : [];
    });
    console.log("📥 Overrides загружены:", Object.keys(overrides).length);
  } catch (e) {
    console.error("overrides load:", e);
    overrides = {};
  }
}

// ============================================================
// ЗАМЕТКИ ПО ДЗ
// ============================================================

async function loadNotes() {
  try {
    const res = await fetch(NOTES_URL + "?select=subject,text", {
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
    });
    if (!res.ok) { notes = {}; return; }
    const rows = await res.json();
    notes = {};
    rows.forEach(r => { notes[r.subject] = r.text; });
    console.log("📝 Заметки загружены:", Object.keys(notes).length);
  } catch (e) {
    console.error("notes load:", e);
    notes = {};
  }
}

// ============================================================
// СОСТОЯНИЕ
// ============================================================

let state = { date: "", done: {}, leftovers: [], lessonsSent: [] };

function loadState() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (!raw) {
      state = { date: new Date().toISOString().slice(0, 10), done: {}, leftovers: [], lessonsSent: [] };
      return;
    }
    const d = JSON.parse(raw);
    const today = new Date().toISOString().slice(0, 10);
    if (d.date === today) {
      state = d;
      state.done = state.done || {};
      state.leftovers = state.leftovers || [];
      state.lessonsSent = state.lessonsSent || [];
    } else {
      const newLeft = [];
      (d.leftovers || []).forEach(lo => {
        const since = new Date(lo.since);
        const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
        if (since >= cutoff) newLeft.push(lo);
      });
      state = { date: today, done: {}, leftovers: newLeft, lessonsSent: [] };
      saveState();
    }
  } catch (e) { console.error(e); }
}

function saveState() {
  try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
  catch (e) { console.error(e); }
}

// ============================================================
// ХЕЛПЕРЫ
// ============================================================

const jsDow = d => (d.getDay() + 6) % 7;

const dateKey = d => {
  const x = new Date(d);
  const p = n => String(n).padStart(2, "0");
  return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}`;
};

function subjectsForDate(date) {
  const k = dateKey(date);
  if (overrides[k]) return overrides[k];
  return SCHOOL_CHART[jsDow(date)] || [];
}

function homeworkSubjectsForDate(date) {
  return subjectsForDate(date).filter(s => !s.includes("*"));
}

function dateHasLessons(date) {
  return subjectsForDate(date).length > 0;
}

function nextSchoolDate(fromDate) {
  let d = new Date(fromDate);
  for (let i = 0; i < 7; i++) {
    d.setDate(d.getDate() + 1);
    if (dateHasLessons(d)) return new Date(d);
  }
  return null;
}

function daysFromToday(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const o = new Date(y, m - 1, d);
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((o - t) / 86400000);
}

function timeStr(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
}

function fmtTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

function tsId() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function escapeHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function renderNoteHtml(text) {
  const safe = escapeHtml(text);
  return safe.replace(/(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

// ============================================================
// ПЛАН ДНЯ
// ============================================================

function buildTodayPlan(date) {
  const dow = jsDow(date);

  const olymp = [];
  for (const [dateStr, name] of Object.entries(OLYMPIADS)) {
    const delta = daysFromToday(dateStr);
    if (delta === 1 || delta === 2) {
      olymp.push({ text: `🏆 Олимпиада (${name}, 40 мин)`, kind: "study", section: "school" });
    }
  }

  const school = [];
  const tmr = nextSchoolDate(date);
  if (tmr) {
    for (const subj of homeworkSubjectsForDate(tmr)) {
      school.push({ text: `📚 Домашка: ${subj}`, kind: "study", section: "school" });
    }
  }

  const music = (DAILY_MUSIC_HOMEWORK[dow] || []).map(m => ({
    text: m.text, kind: m.kind, section: "music"
  }));

  const base = [];
  if (dow <= 4) {
    base.push({
      text: dow === 4 ? "🎒 Собрать портфель (на Пн)" : "🎒 Собрать портфель",
      kind: "photo", section: "base"
    });
    base.push({
      text: dow === 4 ? "👗 Приготовить одежду (на Пн)" : "👗 Приготовить одежду",
      kind: "photo", section: "base"
    });
  }
  base.push({ text: "🧹 Прибрать в комнате", kind: "photo", section: "base" });

  return [...olymp, ...school, ...music, ...base];
}

// Находим заметку к задаче
function subjectFromTask(text) {
  let s = String(text || "");
  s = s.replace(/^\s*📚\s*Домашка:\s*/i, "");
  s = s.replace(/^\s*🏆\s*Олимпиада\s*\(\s*/i, "");
  s = s.replace(/\s*\(\d+\s*мин\s*\)\s*$/, "");
  s = s.replace(/\s*\(\s*\d+\s*мин\s*\)\s*/g, "");
  s = s.replace(/^[🎵🎹📖📝🎻🏆🎒👗🧹🎮]\s*/u, "");
  s = s.replace(/,.*$/, "");
  return s.trim();
}

function getNoteForTask(planItem) {
  if (planItem.section === "base") return null;
  if (planItem.text.includes("🏆")) return null;
  if (planItem.text.includes("Игра")) return null;

  const subj = subjectFromTask(planItem.text);
  if (!subj) return null;
  if (notes[subj]) return notes[subj];

  for (const k of Object.keys(notes)) {
    if (subj.toLowerCase().includes(k.toLowerCase()) ||
        k.toLowerCase().includes(subj.toLowerCase())) {
      return notes[k];
    }
  }
  return null;
}

function buildOrientationText() {
  const now = new Date();
  const dow = jsDow(now);
  const lines = [];

  const sToday = subjectsForDate(now);
  const mToday = MUSIC_CHART[dow] || [];
  lines.push(`📍 Сегодня, ${WEEKDAYS[dow]}:`);
  lines.push(sToday.length ? `   Школа: ${sToday.length} уроков` : "   Школа: выходной");
  lines.push(mToday.length ? `   Музыкалка: ${mToday.join(", ")}` : "   Музыкалка: занятий нет");

  const tmr = nextSchoolDate(now);
  lines.push("");
  if (!tmr) {
    lines.push("📅 Завтра: выходной 🎉");
  } else {
    const td = jsDow(tmr);
    const ts = subjectsForDate(tmr);
    const tm = MUSIC_CHART[td] || [];
    const clean = ts.map(s => s.replace("*", ""));
    lines.push(`📅 Завтра, ${WEEKDAYS[td]} (${tmr.getDate()} ${MONTHS[tmr.getMonth()]}):`);
    if (ts.length) {
      lines.push(`   Школа: ${ts.length} уроков`);
      lines.push("   " + clean.join(", "));
      lines.push(`   📚 Учебников: ${homeworkSubjectsForDate(tmr).length}`);
    } else {
      lines.push("   Школа: выходной");
    }
    lines.push(tm.length ? `   Музыкалка: ${tm.join(", ")}` : "   Музыкалка: занятий нет");
  }

  return lines.join("\n");
}

function sendToCloud(title) {
  fetch(TABLE_URL, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": "return=minimal"
    },
    body: JSON.stringify({ title, is_done: true })
  }).then(r => {
    if (r.status >= 300) console.warn("⚠️ cloud:", r.status);
    else console.log("✅ отправлено:", title);
  }).catch(e => console.error("cloud error:", e));
}

async function uploadBlob(bucket, path, blob, contentType) {
  const url = `${SUPABASE_URL}/storage/v1/object/${bucket}/${path}`;
  try {
    const r = await fetch(url, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": contentType,
        "x-upsert": "true"
      },
      body: blob
    });
    if (r.status >= 300) {
      console.warn("⚠️ storage:", r.status, await r.text());
      return false;
    }
    console.log("✅ загружено:", path);
    return true;
  } catch (e) {
    console.error("storage error:", e);
    return false;
  }
}

// ============================================================
// ОТРИСОВКА
// ============================================================

const $tasks = document.getElementById("tasks");
const $orientation = document.getElementById("orientation");
const $status = document.getElementById("status");
const $flash = document.getElementById("flash");

function showFlash(msg) {
  $flash.textContent = msg;
  $flash.classList.remove("hidden");
  setTimeout(() => $flash.classList.add("hidden"), 2000);
}

function setStatus(msg) { $status.textContent = msg; }

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function render() {
  $orientation.textContent = buildOrientationText();
  $tasks.innerHTML = "";

  const plan = buildTodayPlan(new Date());
  const school = [], music = [], base = [];
  plan.forEach(item => {
    if (item.section === "school") school.push(item);
    else if (item.section === "music") music.push(item);
    else base.push(item);
  });

  if (school.length) {
    $tasks.appendChild(el("div", "section-title sec-school", "📚 Учёба"));
    school.forEach(it => $tasks.appendChild(buildTaskRow(it)));
  }
  if (music.length) {
    $tasks.appendChild(el("div", "section-title sec-music", "🎼 Музыкальная домашка"));
    music.forEach(it => $tasks.appendChild(buildTaskRow(it)));
  }
  if (base.length) {
    $tasks.appendChild(el("div", "section-title sec-base", "🏠 Бытовые дела"));
    base.forEach(it => $tasks.appendChild(buildTaskRow(it)));
  }

  const currentNorms = new Set(plan.map(p => normText(p.text)));
  const visibleLeft = state.leftovers.filter(lo => !currentNorms.has(normText(lo.text)));
  if (visibleLeft.length) {
    $tasks.appendChild(el("div", "section-title sec-left", "↪ Хвосты"));
    visibleLeft.forEach(lo => {
      $tasks.appendChild(buildTaskRow({
        text: lo.text + (lo.since ? ` (с ${lo.since.split("-").reverse().slice(0,2).join(".")})` : ""),
        kind: lo.kind || "study",
        section: "left",
        _raw: lo.text
      }, true));
    });
  }

  recount();
}

function normText(s) {
  return (s || "").toLowerCase().replace(/[^\wа-яё]+/gi, "");
}

function buildTaskRow(item, isLeftover = false) {
  const row = el("div", "task");
  const key = isLeftover ? item._raw : item.text;

  if (state.done[key]) row.classList.add("done");

  const chk = el("div", "task-check", "✓");
  const body = el("div", "task-body");
  const title = el("div", "task-title", item.text);
  body.appendChild(title);

  // Заметка по ДЗ
  const note = getNoteForTask(item);
  if (note) {
    const noteEl = el("div", "task-note");
    noteEl.innerHTML = "📝 " + renderNoteHtml(note);
    body.appendChild(noteEl);
  }

  const ts = state.done[key];
  if (ts) body.appendChild(el("div", "task-time", "✓ " + timeStr(ts)));

  const ico = el("div", "task-ico");
  if (item.kind === "audio" || /Флейта|Оркестр/.test(item.text)) ico.textContent = "🎵";
  else if (item.kind === "photo") ico.textContent = "📸";

  row.appendChild(chk);
  row.appendChild(body);
  if (ico.textContent) row.appendChild(ico);

  row.addEventListener("click", (e) => {
    // Если клик по ссылке в заметке — не переключаем задачу
    if (e.target.tagName === "A") return;
    handleTaskClick(item, key, row, isLeftover);
  });
  return row;
}

function recount() {
  const total = document.querySelectorAll(".task").length;
  const done = document.querySelectorAll(".task.done").length;
  if (total && done >= total) setStatus("🚀 Миссия выполнена, капитан Вера! 🫡");
}

// ============================================================
// ЛОГИКА КЛИКОВ
// ============================================================

let lastActionTime = 0;

function cooldownRemaining() {
  return Math.max(0, COOLDOWN_SECONDS - (Date.now() - lastActionTime) / 1000);
}

function handleTaskClick(item, key, row, isLeftover) {
  if (state.done[key]) { showFlash("Уже сделано ✓"); return; }

  if (item.kind === "audio" || /Флейта|Оркестр/.test(item.text)) {
    openFluteModal(item.text, key); return;
  }
  if (item.kind === "photo") { openCamModal(item.text, key); return; }

  const rem = cooldownRemaining();
  if (rem > 0) { setStatus(`⚠️ Не части! Подожди ${Math.ceil(rem)} сек.`); return; }

  markDone(item.text, key, isLeftover);
  lastActionTime = Date.now();
  showPraise(item.text);
}

function markDone(text, key, isLeftover = false) {
  state.done[key] = new Date().toISOString();
  if (isLeftover) state.leftovers = state.leftovers.filter(lo => lo.text !== key);
  saveState();
  const clean = text.replace(/^[🎒👗🧹📚🎵🏆🎹📝📖🎻]\s*/u, "");
  sendToCloud(isLeftover ? "Хвост: " + clean : clean);
  render();
}

function showPraise(text) {
  if (/Математика|Сольфеджио/.test(text)) {
    setStatus(["Ты сегодня королева чисел! 📐", "Отличный счёт! 🧠"][Math.floor(Math.random() * 2)]);
  } else if (/Русский|Литература/.test(text)) {
    setStatus(["Грамотность на высоте! ✍️", "Прекрасная работа с текстом! 📚"][Math.floor(Math.random() * 2)]);
  } else if (/Фортепиано|Муз\. литература/.test(text)) {
    setStatus("🎵 Музыка — это твоя суперсила! 🌟");
  } else if (/Олимпиада/.test(text)) {
    setStatus("🏆 Готовимся к олимпиаде! Удачи!");
  } else {
    setStatus("Отличный шаг вперёд! 💪");
  }
  setTimeout(() => setStatus(""), 4000);
}

const $fluteModal = document.getElementById("flute-modal");
const $fluteTitle = document.getElementById("flute-title");
const $fluteHint = document.getElementById("flute-hint");
const $fluteTimer = document.getElementById("flute-timer");
const $fluteStart = document.getElementById("flute-start");
const $fluteCancel = document.getElementById("flute-cancel");
const $recDot = document.getElementById("rec-dot");
const $recLabel = document.getElementById("rec-label");

let fluteSession = null;

function openFluteModal(taskText, key) {
  fluteSession = {
    taskText, key, active: false, cancelled: false,
    fragments: [], sessionId: null, stream: null,
    startTs: 0, running: false
  };

  const base = taskText.replace(/^[🎵🎻]\s*/, "").split(" (")[0];
  $fluteTitle.textContent = base + " — " + FLUTE_MINUTES + " минут";
  $fluteHint.textContent = "Нажми «Начать». Пока идёт запись — играй.";
  $fluteTimer.textContent = fmtTime(FLUTE_MINUTES * 60);
  $fluteStart.disabled = false;
  $fluteStart.textContent = "▶ Начать";
  $fluteCancel.disabled = false;
  $fluteCancel.textContent = "◀ Отмена";
  $recDot.style.display = "none";
  $recLabel.textContent = "";

  $fluteModal.classList.remove("hidden");
}

$fluteStart.addEventListener("click", () => {
  if (!fluteSession || fluteSession.running) return;
  fluteSession.running = true;
  fluteSession.active = true;
  fluteSession.startTs = Date.now();
  fluteSession.sessionId = tsId();
  fluteSession.fragments = [];
  fluteSession.cancelled = false;

  $fluteStart.disabled = true;
  $fluteCancel.textContent = "◀ Прервать";
  $recDot.style.display = "inline-block";
  $recLabel.textContent = "● REC";
  $fluteHint.textContent = "Идёт запись. Пока не останавливай.";

  runFluteSession();
});

$fluteCancel.addEventListener("click", () => {
  if (!fluteSession) return;
  if (!fluteSession.active) { closeFlute(); return; }
  $fluteCancel.disabled = true;
  $fluteHint.textContent = "Останавливаю запись…";
  fluteSession.cancelled = true;
});

async function runFluteSession() {
  const session = fluteSession;
  if (!session) return;

  if (typeof MediaRecorder === "undefined") {
    $fluteHint.textContent = "⚠️ Запись звука не поддерживается браузером.";
    $fluteStart.disabled = true;
    return;
  }

  try {
    session.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    console.error(e);
    $fluteHint.textContent = "⚠️ Микрофон недоступен. Скажи маме.";
    $recDot.style.display = "none";
    $recLabel.textContent = "";
    return;
  }

  const totalSeconds = FLUTE_MINUTES * 60;
  let nextFragmentTime = 0;
  let fragmentIdx = 0;

  while (true) {
    if (session.cancelled) break;
    const elapsed = (Date.now() - session.startTs) / 1000;
    if (elapsed >= totalSeconds) break;

    const remain = Math.max(0, totalSeconds - elapsed);
    $fluteTimer.textContent = fmtTime(remain);

    if (fragmentIdx < TOTAL_FRAGMENTS && elapsed >= nextFragmentTime) {
      try {
        const blob = await recordSeconds(session.stream, FRAGMENT_DURATION);
        if (blob && blob.size > 0) {
          session.fragments.push({ idx: fragmentIdx + 1, blob });
          console.log(`✅ Фрагмент ${fragmentIdx + 1} записан (${Math.round(blob.size/1024)} КБ)`);
        }
      } catch (e) { console.error("Ошибка записи фрагмента:", e); }
      fragmentIdx++;
      nextFragmentTime = fragmentIdx * FRAGMENT_INTERVAL;
      continue;
    }
    await sleep(250);
  }

  $fluteTimer.textContent = fmtTime(session.cancelled ? Math.floor((Date.now() - session.startTs) / 1000) : 0);

  if (session.stream) {
    session.stream.getTracks().forEach(t => t.stop());
    session.stream = null;
  }
  $recDot.style.display = "none";
  $recLabel.textContent = "";

  $fluteHint.textContent = "Отправляю маме…";
  await uploadAllFragments(session);

  $fluteModal.classList.add("hidden");
  fluteSession = null;
  render();

  if (!session.cancelled && session.fragments.length > 0) {
    setStatus("🎵 Отлично! Запись отправлена маме 🌟");
    setTimeout(() => setStatus(""), 4000);
  }
}

function recordSeconds(stream, seconds) {
  return new Promise((resolve, reject) => {
    let mime = "";
    for (const candidate of ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"]) {
      if (MediaRecorder.isTypeSupported(candidate)) { mime = candidate; break; }
    }
    let rec;
    try { rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); }
    catch (e) { reject(e); return; }
    const chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onerror = e => reject(e);
    rec.onstop = () => {
      const type = rec.mimeType || mime || "audio/webm";
      resolve(new Blob(chunks, { type }));
    };
    try { rec.start(); } catch (e) { reject(e); return; }
    setTimeout(() => { try { rec.stop(); } catch (e) {} }, seconds * 1000);
  });
}

async function uploadAllFragments(session) {
  const sid = session.sessionId;
  if (!sid) return;
  let uploaded = 0;
  for (const f of session.fragments) {
    let ext = "webm";
    const t = (f.blob.type || "").toLowerCase();
    if (t.includes("mp4")) ext = "m4a";
    else if (t.includes("ogg")) ext = "ogg";
    const name = `frag_${String(f.idx).padStart(2, "0")}.${ext}`;
    const path = `${sid}/${name}`;
    const ok = await uploadBlob(STORAGE_BUCKET, path, f.blob, f.blob.type || "audio/webm");
    if (ok) uploaded++;
  }
  const base = session.taskText.replace(/^[🎵🎻]\s*/, "").split(" (")[0];
  const title = session.cancelled
    ? `${base}: прервано, ${uploaded} фрагментов [sid=${sid}]`
    : `${base}: ${FLUTE_MINUTES} мин, ${uploaded} фрагментов [sid=${sid}]`;
  console.log("📤 Отправляю в облако:", title);
  sendToCloud(title);
  if (!session.cancelled && uploaded > 0) {
    state.done[session.key] = new Date().toISOString();
    saveState();
  }
}

function closeFlute() {
  if (fluteSession && fluteSession.stream) {
    fluteSession.stream.getTracks().forEach(t => t.stop());
  }
  fluteSession = null;
  $fluteModal.classList.add("hidden");
  render();
}

// КАМЕРА

const $camModal = document.getElementById("cam-modal");
const $camTitle = document.getElementById("cam-title");
const $camHint = document.getElementById("cam-hint");
const $camVideo = document.getElementById("cam-video");
const $camProgress = document.getElementById("cam-progress");
const $camSnap = document.getElementById("cam-snap");
const $camCancel = document.getElementById("cam-cancel");

let camSession = null;

async function openCamModal(taskText, key) {
  const base = taskText.split(" (")[0];
  const steps = PHOTO_STEPS[base] || [
    { title: "Сфотографируй результат", hint: "Нажми «Сделать фото», когда готово", role: "photo" }
  ];

  camSession = { taskText, key, steps, stepIdx: 0, photos: [], sessionId: tsId(), stream: null };

  $camProgress.textContent = `Шаг 1 / ${steps.length}`;
  $camTitle.textContent = "📸 " + base;
  $camHint.textContent = steps[0].title + "\n" + (steps[0].hint || "");
  $camSnap.disabled = false;
  $camSnap.textContent = "📸 СДЕЛАТЬ ФОТО";
  $camCancel.disabled = false;
  $camModal.classList.remove("hidden");

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }, audio: false
    });
    camSession.stream = stream;
    $camVideo.srcObject = stream;
  } catch (e) {
    console.error(e);
    $camHint.textContent = "⚠️ Камера недоступна. Скажи маме.";
    $camSnap.disabled = true;
  }
}

$camSnap.addEventListener("click", () => {
  if (!camSession) return;
  $camSnap.disabled = true;

  const canvas = document.createElement("canvas");
  const vw = $camVideo.videoWidth || 640;
  const vh = $camVideo.videoHeight || 480;
  canvas.width = vw; canvas.height = vh;
  canvas.getContext("2d").drawImage($camVideo, 0, 0);

  canvas.toBlob(blob => {
    if (blob) {
      const step = camSession.steps[camSession.stepIdx];
      camSession.photos.push({ role: step.role, blob });
      camSession.stepIdx++;
      if (camSession.stepIdx >= camSession.steps.length) {
        finishCam();
      } else {
        const s = camSession.steps[camSession.stepIdx];
        $camProgress.textContent = `Шаг ${camSession.stepIdx + 1} / ${camSession.steps.length}`;
        $camHint.textContent = s.title + "\n" + (s.hint || "");
        $camSnap.textContent = "📸 СДЕЛАТЬ ВТОРОЕ ФОТО";
        $camSnap.disabled = false;
      }
    } else {
      $camSnap.disabled = false;
    }
  }, "image/jpeg", 0.85);
});

$camCancel.addEventListener("click", () => closeCam());

async function finishCam() {
  const session = camSession;
  $camHint.textContent = "Отправляю…";
  $camSnap.disabled = true;
  $camCancel.disabled = true;
  for (const p of session.photos) {
    const path = `${session.sessionId}/${p.role}.jpg`;
    await uploadBlob(PHOTO_BUCKET, path, p.blob, "image/jpeg");
  }
  const clean = session.taskText.replace(/^[🎒👗🧹]\s*/u, "");
  const title = `Фотоотчет: ${clean} [sid=${session.sessionId}]`;
  console.log("📤 Отправляю:", title);
  sendToCloud(title);
  state.done[session.key] = new Date().toISOString();
  saveState();
  closeCam();
  render();
  setStatus("📸 Отчёт отправлен маме!");
  setTimeout(() => setStatus(""), 3000);
}

function closeCam() {
  if (camSession && camSession.stream) {
    camSession.stream.getTracks().forEach(t => t.stop());
  }
  if ($camVideo.srcObject) $camVideo.srcObject = null;
  camSession = null;
  $camModal.classList.add("hidden");
  $camSnap.textContent = "📸 СДЕЛАТЬ ФОТО";
}
