<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вера — вход</title>
<style>
  body { background:#0e0e0e; color:#fff;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         margin:0; padding:30px 20px; min-height:100vh;
         display:flex; flex-direction:column; align-items:center; justify-content:center; }
  h1 { font-size:22px; margin-bottom:30px; color:#00ffb3; text-align:center; }
  a, button {
    display:block; width:100%; max-width:320px; text-align:center;
    padding:18px; margin-bottom:14px; border-radius:12px;
    font-size:17px; font-weight:bold; text-decoration:none;
    border:none; cursor:pointer; font-family:inherit;
  }
  .child { background:#00ffb3; color:#0e0e0e; }
  .mom { background:#333; color:#fff; }
  .hint { color:#666; font-size:13px; margin-top:20px; text-align:center; }

  .modal { position:fixed; inset:0; background:rgba(0,0,0,0.85);
           display:flex; align-items:center; justify-content:center; padding:20px;
           z-index:100; backdrop-filter:blur(4px); }
  .modal.hidden { display:none; }
  .modal-box { background:#1a1a1a; border-radius:16px; padding:24px;
               width:100%; max-width:320px; border:1px solid #2a2a2a; }
  .modal-title { font-size:16px; font-weight:bold; color:#00ffb3;
                 margin-bottom:14px; text-align:center; }
  .pin-input { display:block; width:100%; padding:14px;
               font-size:24px; text-align:center; letter-spacing:8px;
               background:#0e0e0e; color:#fff; border:1px solid #333;
               border-radius:10px; margin-bottom:12px;
               font-family:inherit; }
  .modal-btn { display:block; width:100%; padding:14px;
               background:#00ffb3; color:#0e0e0e; border:none;
               border-radius:10px; font-size:16px; font-weight:bold;
               margin-top:8px; cursor:pointer; font-family:inherit; }
  .modal-btn.alt { background:#333; color:#fff; }
</style>
</head>
<body>
  <h1>Программа Веры</h1>
  <a class="child" href="index_child_phone.html">👧 Детская программа</a>
  <button class="mom" onclick="showPin()">🔒 Панель мамы</button>
  <div class="hint">Открывай это на телефоне и добавляй на главный экран</div>

  <div class="modal hidden" id="pin-modal">
    <div class="modal-box">
      <div class="modal-title">🔒 Введите PIN-код</div>
      <input class="pin-input" id="pin-input" type="tel" inputmode="numeric"
             maxlength="4" placeholder="••••" autocomplete="off">
      <button class="modal-btn" id="pin-ok">🔓 Войти</button>
      <button class="modal-btn alt" id="pin-cancel">Отмена</button>
    </div>
  </div>

<script>
const PIN = "1234";
const $modal = document.getElementById("pin-modal");
const $input = document.getElementById("pin-input");

function showPin() {
  $input.value = "";
  $input.placeholder = "••••";
  $modal.classList.remove("hidden");
  setTimeout(() => $input.focus(), 100);
}

document.getElementById("pin-ok").addEventListener("click", () => {
  if ($input.value === PIN) {
    sessionStorage.setItem("mom_ok", "1");
    window.location.href = "index_mom_phone.html";
  } else {
    $input.value = "";
    $input.placeholder = "❌ Неверно";
  }
});

document.getElementById("pin-cancel").addEventListener("click", () => {
  $modal.classList.add("hidden");
});

$input.addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("pin-ok").click();
});
</script>
</body>
</html>
